name: Conformance

# Runs the conformance kit in kit/ against the ai2rules-harness release on npm named
# by KERNEL_VERSION, and the concept crates' tests. Weekly as well, so a broken
# registry download or a yanked version shows up without a push.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy, rustfmt
      - name: Install the released kernel from npm
        run: |
          ver="$(tr -d '[:space:]' < KERNEL_VERSION)"
          npm install -g "ai2rules-harness@${ver#v}"
          harness --version
      - name: Format and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Concept tests
        run: cargo test --workspace
      - name: Conformance against the npm binary
        run: cargo run -p conformance -- --harness harness --kit kit
